name: Build APK from ZIP (scan all)

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug หรือ release'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repo for zips and Gradle projects
        id: scan
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          rm -rf "$WORK" && mkdir -p "$WORK"
          ROOTS="$RUNNER_TEMP/roots.txt"
          : > "$ROOTS"

          echo "=== ZIP files in repo ==="
          find . -path ./.git -prune -o -type f -name '*.zip' -print | sort > "$RUNNER_TEMP/zips.txt"
          cat "$RUNNER_TEMP/zips.txt" || true

          # แตกทุก zip ที่เจอ ลงโฟลเดอร์แยกของแต่ละไฟล์
          while IFS= read -r z; do
            [ -z "$z" ] && continue
            dest="$WORK/$(basename "$z" .zip)"
            mkdir -p "$dest"
            echo "Unzipping $z -> $dest"
            unzip -q -o "$z" -d "$dest" || echo "::warning::unzip failed: $z"
          done < "$RUNNER_TEMP/zips.txt"

          # สแกนหา settings.gradle(.kts) ทั้งใน repo และในที่แตกแล้ว
          ( find . "$WORK" -path ./.git -prune -o -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print \
              | grep -vE '/(build|\.gradle)/' || true ) > "$RUNNER_TEMP/settings.txt"

          while IFS= read -r s; do
            [ -z "$s" ] && continue
            (cd "$(dirname "$s")" && pwd -P) >> "$ROOTS"
          done < "$RUNNER_TEMP/settings.txt"
          sort -u "$ROOTS" -o "$ROOTS"

          echo "=== Gradle project roots ==="
          cat "$ROOTS"
          if [ ! -s "$ROOTS" ]; then
            echo "::error::ไม่พบโปรเจกต์ Gradle (settings.gradle) ทั้งใน repo และใน zip"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          set -u
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "Using sdkmanager: $SDKM"

          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build every project found
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -uo pipefail
          ROOTS="$RUNNER_TEMP/roots.txt"
          OUT="$GITHUB_WORKSPACE/apk-out"
          mkdir -p "$OUT"

          if [ "$BUILD_TYPE" = "release" ]; then TASK="assembleRelease"; else TASK="assembleDebug"; fi
          echo "Task: $TASK"

          BUILT=0; FAILED=0; IDX=0
          while IFS= read -r root; do
            [ -z "$root" ] && continue
            IDX=$((IDX + 1))
            echo "::group::[$IDX] Building $root"
            cd "$root"

            if [ ! -f gradlew ]; then
              echo "gradlew missing — generating wrapper"
              gradle wrapper --gradle-version 8.5
            fi
            chmod +x gradlew

            if ./gradlew "$TASK" --stacktrace --no-daemon; then
              BUILT=$((BUILT + 1))
              find . -type f -name '*.apk' -path '*/build/outputs/apk/*' | while IFS= read -r apk; do
                cp -v "$apk" "$OUT/$(printf '%02d' "$IDX")_$(basename "$root")_$(basename "$apk")"
              done
            else
              FAILED=$((FAILED + 1))
              echo "::warning::Build failed: $root"
            fi

            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done < "$ROOTS"

          echo "=== Summary: built=$BUILT failed=$FAILED ==="
          ls -la "$OUT"
          [ "$BUILT" -gt 0 ] || { echo "::error::ไม่มี APK ที่ build สำเร็จเลย"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WorldBoxModLoader-APK
          path: apk-out/*.apk
          if-no-files-found: error
