name: Build APK from ZIP (scan all)

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug หรือ release'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repo for zips and Gradle projects
        id: scan
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/work"
          rm -rf "$WORK" && mkdir -p "$WORK"
          ROOTS="$RUNNER_TEMP/roots.txt"
          : > "$ROOTS"

          echo "=== ZIP files in repo ==="
          find . -path ./.git -prune -o -type f -name '*.zip' -print | sort > "$RUNNER_TEMP/zips.txt"
          cat "$RUNNER_TEMP/zips.txt" || true

          # แตกทุก zip ที่เจอ ลงโฟลเดอร์แยกของแต่ละไฟล์
          while IFS= read -r z; do
            [ -z "$z" ] && continue
            dest="$WORK/$(basename "$z" .zip)"
            mkdir -p "$dest"
            echo "Unzipping $z -> $dest"
            unzip -q -o "$z" -d "$dest" || echo "::warning::unzip failed: $z"
          done < "$RUNNER_TEMP/zips.txt"

          # สแกนหา settings.gradle(.kts) ทั้งใน repo และในที่แตกแล้ว
          ( find . "$WORK" -path ./.git -prune -o -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print \
              | grep -vE '/(build|\.gradle)/' || true ) > "$RUNNER_TEMP/settings.txt"

          while IFS= read -r s; do
            [ -z "$s" ] && continue
            (cd "$(dirname "$s")" && pwd -P) >> "$ROOTS"
          done < "$RUNNER_TEMP/settings.txt"
          sort -u "$ROOTS" -o "$ROOTS"

          echo "=== Gradle project roots ==="
          cat "$ROOTS"
          if [ ! -s "$ROOTS" ]; then
            echo "::error::ไม่พบโปรเจกต์ Gradle (settings.gradle) ทั้งใน repo และใน zip"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          set -u
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "Using sdkmanager: $SDKM"

          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build every project found
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -uo pipefail
          ROOTS="$RUNNER_TEMP/roots.txt"
          OUT="$GITHUB_WORKSPACE/apk-out"
          mkdir -p "$OUT"

          if [ "$BUILD_TYPE" = "release" ]; then TASK="assembleRelease"; else TASK="assembleDebug"; fi
          echo "Task: $TASK"

          # เลือกเวอร์ชัน Gradle: ใช้ของโปรเจกต์ก่อน ไม่มีก็เดาจากเวอร์ชัน AGP
          pick_gradle() {
            local props=gradle/wrapper/gradle-wrapper.properties v agp
            if [ -f "$props" ]; then
              v=$(sed -nE 's#.*gradle-([0-9][0-9.]*)(-rc-[0-9]+)?-(bin|all)\.zip.*#\1#p' "$props" | head -1)
              if [ -n "$v" ]; then echo "$v"; return; fi
            fi
            agp=$( { grep -rhoE --include='*.gradle' --include='*.gradle.kts' --include='*.toml' \
                      --exclude-dir=build --exclude-dir=.gradle \
                      -e "com\.android\.(application|library)[\"']?\)?[[:space:]]*version[[:space:]]*\(?[\"']?[0-9]+\.[0-9]+" \
                      -e "com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+" \
                      -e "^agp[[:space:]]*=[[:space:]]*\"[0-9]+\.[0-9]+" . 2>/dev/null || true; } \
                    | grep -oE '[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            case "$agp" in
              9.*)            echo "9.1.0" ;;
              8.13|8.12|8.11) echo "8.13" ;;
              8.10|8.9)       echo "8.11.1" ;;
              8.8)            echo "8.10.2" ;;
              8.7)            echo "8.9" ;;
              8.6|8.5)        echo "8.7" ;;
              8.4)            echo "8.6" ;;
              8.3)            echo "8.4" ;;
              8.2)            echo "8.2" ;;
              8.1|8.0)        echo "8.0" ;;
              *)              echo "8.10.2" ;;
            esac
          }

          # สร้าง gradle wrapper ในโฟลเดอร์ว่างก่อน แล้วค่อยก็อปเข้าโปรเจกต์
          # (กัน gradle ของ runner มาอ่านโปรเจกต์แล้วพังเพราะเวอร์ชันไม่เข้ากัน)
          make_wrapper() {
            local ver="$1" tmp
            tmp="$(mktemp -d)"
            ( cd "$tmp" && gradle wrapper --gradle-version "$ver" --no-daemon -q ) || return 1
            mkdir -p gradle/wrapper
            cp "$tmp/gradlew" "$tmp/gradlew.bat" .
            cp "$tmp/gradle/wrapper/"* gradle/wrapper/
            chmod +x gradlew
          }

          BUILT=0; FAILED=0; IDX=0
          while IFS= read -r root; do
            [ -z "$root" ] && continue
            IDX=$((IDX + 1))
            cd "$root"
            LOG="$RUNNER_TEMP/build_$IDX.log"

            GV="$(pick_gradle)"
            CANDIDATES="$GV"
            # ถ้าโปรเจกต์ไม่ได้กำหนด Gradle เอง ให้ลองเวอร์ชันสำรองถ้าอันแรกพัง
            if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
              for alt in 8.10.2 8.13; do
                [ "$alt" != "$GV" ] && CANDIDATES="$CANDIDATES $alt"
              done
            fi

            OK=0
            for ver in $CANDIDATES; do
              echo "::group::[$IDX] $root — Gradle $ver"
              if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! grep -q "gradle-$ver-" gradle/wrapper/gradle-wrapper.properties 2>/dev/null; then
                make_wrapper "$ver" || { echo "::endgroup::"; echo "::warning::สร้าง wrapper $ver ไม่สำเร็จ"; continue; }
              fi
              ./gradlew "$TASK" --stacktrace --no-daemon --console=plain 2>&1 | tee "$LOG"
              rc=${PIPESTATUS[0]}
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then OK=1; break; fi

              echo "=========== สาเหตุที่ build พัง (Gradle $ver) ==========="
              grep -n -A12 "What went wrong" "$LOG" | head -40 || true
              echo "--- Caused by ---"
              grep -E "^Caused by:" "$LOG" | sort -u | head -10 || true
              echo "========================================================"
            done

            if [ "$OK" -eq 1 ]; then
              BUILT=$((BUILT + 1))
              find . -type f -name '*.apk' -path '*/build/outputs/apk/*' | while IFS= read -r apk; do
                cp -v "$apk" "$OUT/$(printf '%02d' "$IDX")_$(basename "$root")_$(basename "$apk")"
              done
            else
              FAILED=$((FAILED + 1))
              echo "::warning::Build failed: $root"
            fi

            cd "$GITHUB_WORKSPACE"
          done < "$ROOTS"

          echo "=== Summary: built=$BUILT failed=$FAILED ==="
          ls -la "$OUT"
          [ "$BUILT" -gt 0 ] || { echo "::error::ไม่มี APK ที่ build สำเร็จเลย"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WorldBoxModLoader-APK
          path: apk-out/*.apk
          if-no-files-found: error
