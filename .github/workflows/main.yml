name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: แตกไฟล์ zip
        run: |
          mkdir -p _src
          count=0
          for z in *.zip; do
            [ -e "$z" ] || continue
            echo "แตกไฟล์: $z"
            unzip -q -o "$z" -d _src
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ไม่พบไฟล์ .zip ที่ root ของ repo"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          f=$(find _src -not -path '*/__MACOSX*' \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$f" ]; then
            echo "ไม่พบ settings.gradle(.kts) ใน zip"
            exit 1
          fi
          dir=$(dirname "$f")
          echo "โปรเจกต์อยู่ที่: $dir"
          if ! grep -qs "android.useAndroidX" "$dir/gradle.properties"; then
            printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nkotlin.code.style=official\n' >> "$dir/gradle.properties"
          fi
          gradle -p "$dir" :app:assembleDebug --no-daemon
          mkdir -p out
          cp "$dir/app/build/outputs/apk/debug/app-debug.apk" out/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk
