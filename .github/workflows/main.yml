name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: แสดงไฟล์ใน repo
        run: find . -path ./.git -prune -o -print | head -100

      - name: หาโปรเจกต์ Gradle
        id: find
        run: |
          f=$(find . -path ./.git -prune -o \( -name settings.gradle -o -name settings.gradle.kts \) -print | head -n 1)
          if [ -z "$f" ]; then
            echo "ไม่พบ settings.gradle หรือ settings.gradle.kts ใน repo"
            exit 1
          fi
          dir=$(dirname "$f")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "พบโปรเจกต์ที่: $dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p "${{ steps.find.outputs.dir }}" :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
